<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Afterimage Glitch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div id="sidebar-placeholder"></div>
        <main class="content">
            <h1>Afterimage Glitch</h1>
            <p>Inside the rock wall in Riverside Park, there's a strip of ground along the edge that curves all the way around. If you go there, your character won't fall, but the camera will flip upside-down.</p>
            <iframe width="480" height="270" src="https://www.youtube.com/embed/sPsxQQuUoE0?si=OUziKM85Eg-rxax7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </main>
    </div>
    <script>
    fetch('sidebar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('sidebar-placeholder').innerHTML = html;
        });
    </script>
</body>
</html>
