<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>スタックバグ</title>
    <link rel="stylesheet" href="style.css">
    <script src="common.js" defer></script>
</head>
<body>
    <div class="page">
        <div id="sidebar-placeholder"></div>
        <main class="content">
            <h1>スタックバグ</h1>
            <p>ステージ上には、はまり込んでしまうオブジェクトがあります。一度はまると、アクセルやジャンプが使えなくなり、スターなどのアイテムを使わない限り抜け出せません。</p>
            <p>いくつかのコースには、そのようなオブジェクトや地形があります。以下はその例です。</p>
            <h2>ワルイージスタジアム</h2>
            <img src="images/warusuta.png" alt="ワルイージスタジアム">
            <h2>アテネポリス</h2>
            <img src="images/atene.png" alt="アテネポリス">
            <h2>ねじれマンション</h2>
            <img src="images/twisted.png" alt="ねじれマンション">
        </main>
    </div>
</body>
</html>
